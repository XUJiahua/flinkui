{{- $needConfig := (include "flinkui.needConfig" .) -}}
{{- if $needConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flinkui.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flinkui.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered by the Helm chart. Only ha.* / secret_sync.* are provided here;
    # addr/auth/cluster/s3 come from FKO_* env vars, which override config-file values.
    {{- if or .Values.ha.groups .Values.ha.autoAll }}
    ha:
      {{- with .Values.ha.selfClusterId }}
      self_cluster_id: {{ . | quote }}
      {{- end }}
      {{- with .Values.ha.defaultPeerClusterId }}
      default_peer_cluster_id: {{ . | quote }}
      {{- end }}
      auto_all: {{ .Values.ha.autoAll | default false }}
      groups:
        {{- range .Values.ha.groups }}
        - name: {{ .name | quote }}
          {{- with .namespace }}
          namespace: {{ . | quote }}
          {{- end }}
          {{- with .deployment }}
          deployment: {{ . | quote }}
          {{- end }}
          {{- with .clusterId }}
          cluster_id: {{ . | quote }}
          {{- end }}
          {{- with .peerClusterId }}
          peer_cluster_id: {{ . | quote }}
          {{- end }}
          {{- with .fencingKey }}
          fencing_key: {{ . | quote }}
          {{- end }}
          {{- with .neutralToken }}
          neutral_token: {{ . | quote }}
          {{- end }}
          {{- with .handoffKey }}
          handoff_key: {{ . | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.secretSync.enabled }}
    # OpenBao/Vault -> K8s Secret sync. items (KV path -> Secret) can only be
    # expressed in the config file, not via FKO_* env vars.
    secret_sync:
      enabled: true
      interval_sec: {{ .Values.secretSync.intervalSec | default 300 }}
      openbao:
        {{- with .Values.secretSync.openbao.addr }}
        addr: {{ . | quote }}
        {{- end }}
        {{- with .Values.secretSync.openbao.namespace }}
        namespace: {{ . | quote }}
        {{- end }}
        kv_mount: {{ .Values.secretSync.openbao.kvMount | default "kv" | quote }}
        auth_mount: {{ .Values.secretSync.openbao.authMount | default "kubernetes" | quote }}
        role: {{ .Values.secretSync.openbao.role | default "vault-app-role" | quote }}
        {{- with .Values.secretSync.openbao.token }}
        token: {{ . | quote }}
        {{- end }}
        {{- with .Values.secretSync.openbao.cacert }}
        cacert: {{ . | quote }}
        {{- end }}
      items:
        {{- range .Values.secretSync.items }}
        - secret_name: {{ .secretName | quote }}
          kv_path: {{ .kvPath | quote }}
          {{- if .restart }}
          restart:
            {{- with .restart.mode }}
            mode: {{ . | quote }}
            {{- end }}
            {{- with .restart.deployments }}
            deployments:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.vault.addr }}
    # Vault connection for resolving the console's OWN secret refs at startup.
    vault:
      addr: {{ .Values.vault.addr | quote }}
      {{- with .Values.vault.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      kv_mount: {{ .Values.vault.kvMount | default "kv" | quote }}
      auth_mount: {{ .Values.vault.authMount | default "kubernetes" | quote }}
      role: {{ .Values.vault.role | default "vault-app-role" | quote }}
      {{- with .Values.vault.token }}
      token: {{ . | quote }}
      {{- end }}
      {{- with .Values.vault.cacert }}
      cacert: {{ . | quote }}
      {{- end }}
      {{- if .Values.vault.optional }}
      optional: true
      {{- end }}
    {{- if or .Values.auth.passwordRef.path .Values.auth.sessionSecretRef.path .Values.auth.ldap.bindPasswordRef.path }}
    auth:
      {{- if .Values.auth.passwordRef.path }}
      password_ref: { path: {{ .Values.auth.passwordRef.path | quote }}, key: {{ .Values.auth.passwordRef.key | quote }} }
      {{- end }}
      {{- if .Values.auth.sessionSecretRef.path }}
      session_secret_ref: { path: {{ .Values.auth.sessionSecretRef.path | quote }}, key: {{ .Values.auth.sessionSecretRef.key | quote }} }
      {{- end }}
      {{- if .Values.auth.ldap.bindPasswordRef.path }}
      ldap:
        bind_password_ref: { path: {{ .Values.auth.ldap.bindPasswordRef.path | quote }}, key: {{ .Values.auth.ldap.bindPasswordRef.key | quote }} }
      {{- end }}
    {{- end }}
    {{- if or .Values.s3.accessKeyRef.path .Values.s3.secretKeyRef.path }}
    cluster:
      s3:
        {{- if .Values.s3.accessKeyRef.path }}
        access_key_ref: { path: {{ .Values.s3.accessKeyRef.path | quote }}, key: {{ .Values.s3.accessKeyRef.key | quote }} }
        {{- end }}
        {{- if .Values.s3.secretKeyRef.path }}
        secret_key_ref: { path: {{ .Values.s3.secretKeyRef.path | quote }}, key: {{ .Values.s3.secretKeyRef.key | quote }} }
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
