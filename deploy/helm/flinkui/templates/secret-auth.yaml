{{- if not .Values.auth.existingSecret -}}
{{- if and (not .Values.auth.password) (not .Values.auth.ldap.enabled) (not .Values.auth.passwordRef.path) -}}
{{- fail "auth requires one of: auth.password, auth.ldap.enabled, auth.passwordRef (Vault), or auth.existingSecret. The console must not run unauthenticated." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flinkui.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flinkui.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  {{- if .Values.auth.sessionSecretRef.path }}
  # Resolved from Vault at startup (auth.sessionSecretRef); kept empty here.
  session-secret: ""
  {{- else }}
  session-secret: {{ required "auth.sessionSecret is required (or set auth.sessionSecretRef / auth.existingSecret)" .Values.auth.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.auth.ldap.enabled }}
  ldap-bind-password: {{ .Values.auth.ldap.bindPassword | default "" | quote }}
  {{- end }}
{{- end }}
