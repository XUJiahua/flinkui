# Default values for the flinkui chart.

replicaCount: 1

image:
  repository: docker.io/johnxu1989/flinkui
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Console / cluster configuration (maps to FKO_* env vars). --------------
config:
  # HTTP listen address inside the container.
  addr: ":8080"
  # Display name for the cluster.
  clusterName: "in-cluster"
  # Namespace that holds the FlinkDeployment resources the console manages.
  # RBAC (Role/RoleBinding) is created here so the console can act on those jobs.
  # Defaults to the release namespace when empty.
  targetNamespace: ""
  # FlinkDeployment naming convention prefix (deployment = prefix + job name).
  deploymentPrefix: "flink-sql-job-"
  savepointTimeoutSec: 120
  stopTimeoutSec: 120
  logTailLines: 200
  statusPollSec: 5

# -- Authentication (required). --------------------------------------------
# The console can mutate cluster workloads and must not run unauthenticated.
auth:
  username: "admin"
  # Set password + sessionSecret to create a Secret, OR reference an existing one.
  password: ""
  # Cookie signing secret. Strongly recommended to override (e.g. openssl rand -hex 16).
  sessionSecret: ""
  # Use an existing Secret instead of creating one. It must contain keys:
  #   username, password, session-secret (and ldap-bind-password if LDAP search
  #   bind is used).
  existingSecret: ""
  # -- Optional LDAP / Active Directory authentication. -----------------------
  # When enabled, a login is accepted if it matches the local username/password
  # above OR authenticates against LDAP, so the local account stays usable as a
  # break-glass admin. With LDAP enabled you may leave auth.password empty to
  # make LDAP the only interactive login (sessionSecret is still required).
  ldap:
    enabled: false
    # Server URL: ldap://host:389 or ldaps://host:636.
    url: ""
    # Upgrade a plain ldap:// connection to TLS via StartTLS (ignored for ldaps://).
    startTls: false
    # Skip TLS cert verification (self-signed internal servers).
    insecureSkipVerify: false
    # Direct-bind mode: bind this DN template directly ("%s" = login name).
    #   e.g. "uid=%s,ou=people,dc=example,dc=com"
    userDnTemplate: ""
    # Search+bind mode (used when userDnTemplate is empty): bind as bindDn to
    # search baseDn with userFilter, then re-bind as the found user.
    bindDn: ""
    # Service-account password for the search bind. Stored in the auth Secret
    # (key: ldap-bind-password). Leave empty for anonymous search.
    bindPassword: ""
    baseDn: ""
    # "%s" is replaced with the (escaped) login name, e.g. "(uid=%s)" or
    # "(sAMAccountName=%s)" for Active Directory.
    userFilter: ""
    timeoutSec: 10

# -- S3 / MinIO for the rollback recovery-point selector (optional). --------
s3:
  enabled: false
  # Point at the MinIO S3 *API* port (usually 9000), not the console port.
  endpoint: ""
  # Optional fallback bucket; recovery-point paths are otherwise read from each
  # deployment's state.savepoints.dir / state.checkpoints.dir.
  bucket: ""
  # Optional base key prefix inside the bucket, so several flinkui instances can
  # share one bucket and stay isolated by path (e.g. "tenant-a" => keys under
  # tenant-a/...). The bucket value may also carry the path directly
  # ("flink/tenant-a"); both forms are merged. Affects flinkui-owned keys only
  # (fencing/handoff + fallback savepoint/checkpoint locations).
  prefix: ""
  region: "us-east-1"
  pathStyle: true
  # Skip TLS verification for internal MinIO with a self-signed certificate.
  insecure: false
  accessKey: ""
  secretKey: ""
  # Use an existing Secret with keys: access-key, secret-key
  existingSecret: ""

# -- Extra raw FKO_* env vars (advanced / escape hatch). --------------------
extraEnv: []
#  - name: FKO_SOMETHING
#    value: "x"

# -- Decentralized HA / failover (failover-decentralized). ------------------
# Each side's flinkui acts ONLY on its local cluster; coordination is via the
# shared S3 fencing token + handoff record (enable s3 above with the SHARED
# store). When groups is non-empty OR autoAll is true, the chart renders a
# ConfigMap and runs the binary with -config (env still overrides addr/auth/
# cluster/s3, so only ha.* needs the file).
ha:
  # This instance's fencing identity (token value when active) and the peer's.
  # Required when using autoAll or groups without per-group clusterId/peerClusterId.
  selfClusterId: ""          # e.g. cluster-a
  defaultPeerClusterId: ""   # e.g. cluster-b
  # autoAll: manage EVERY FlinkDeployment in the namespace as an HA group
  # (resolved at runtime), using the identities above. Explicit groups still apply.
  autoAll: false
  # Explicit groups. In the common case each entry is just `- name: <job>`;
  # namespace defaults to config.targetNamespace, deployment to prefix+name,
  # clusterId/peerClusterId to the instance-level values above.
  groups: []
  #  - name: orders                    # => deployment flink-sql-job-orders, ns targetNamespace
  #  - name: special                   # per-group overrides (optional):
  #    namespace: other-ns
  #    deployment: custom-name
  #    clusterId: cluster-a
  #    peerClusterId: cluster-c
  #    # fencingKey / neutralToken / handoffKey also overridable

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Create the Role + RoleBinding granting the minimal permissions
  # (flinkdeployments get/list/watch/patch, pods, pods/log, pods/exec, events).
  create: true

service:
  type: ClusterIP
  port: 80
  # Fixed node port when type is NodePort (30000-32767); empty => auto-assigned.
  nodePort: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flinkui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Probes hit the dedicated health endpoints (public, no auth).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # distroless :nonroot uses UID/GID 65532; a numeric UID is required so the
  # kubelet can verify runAsNonRoot.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# OpenBao/Vault secret-sync (no ESO). When enabled, the console keeps the
# flink-* Secrets in sync from OpenBao and can restart jobs on change. The
# console ServiceAccount also gets secrets get/create/update/patch (see rbac).
# App-level config is via FKO_SECRET_SYNC_* env / config file (see README).
secretSync:
  enabled: false
  # Sync loop interval.
  intervalSec: 300
  # Bump restartNonce on an item's restart target(s) when its value changed.
  autoRestart: false
  openbao:
    # OpenBao/Vault address, e.g. http://vault.vault.svc.cluster.local:8200
    addr: ""
    # Vault Enterprise namespace (leave empty for OpenBao OSS).
    namespace: ""
    # KV v2 mount; secrets are read from <mount>/data/<kvPath>.
    kvMount: "kv"
    # Kubernetes auth mount.
    authMount: "kubernetes"
    # Kubernetes auth role bound to this pod's ServiceAccount.
    role: "vault-app-role"
    # Static token (debug only); empty => Kubernetes auth with the SA token.
    token: ""
    # CA file path for https (must be mounted separately).
    cacert: ""
  # KV path -> Secret mapping. Only expressible via the config file, so the
  # chart renders it into the mounted config.yaml.
  #
  # Each item may declare which FlinkDeployment(s) to restart when the value
  # changes (only when autoRestart is true). restart.mode is one of:
  #   references (DEFAULT) — restart only jobs that reference the Secret
  #                          (envFrom/secretKeyRef/volume); omit `restart` for this
  #   all                  — restart every FlinkDeployment in the namespace
  #   none                 — sync the Secret only, never restart
  # Or set restart.deployments to an explicit list (mutually exclusive with mode).
  items: []
  #  - secretName: flink-job-env
  #    kvPath: config/cil/flink/demo/job-env
  #    # omit `restart` => references mode (restart consumers of this Secret)
  #  - secretName: flink-s3-credentials
  #    kvPath: config/cil/flink/demo/s3
  #    restart:
  #      deployments: [flink-sql-job-a, flink-sql-job-b]
  #  - secretName: shared-env
  #    kvPath: config/cil/flink/demo/shared
  #    restart:
  #      mode: all

# Replay from timestamp (out-of-band SQL ConfigMap + FlinkDeployment spec edits).
# OFF by default: it rewrites the job's Kafka source SQL and forces a stateless
# restart, so it must be used deliberately and only where the target is NOT
# continuously reconciled by GitOps (Argo/Flux would revert the live edit).
# When enabled the ServiceAccount also gets configmaps get/list/patch (see rbac).
# See docs/replay-from-timestamp-design.md.
replay:
  enabled: false
  # Mark the target as GitOps-managed: mutating replay calls then require an
  # explicit confirmDrift, and the UI shows a drift warning.
  gitopsManaged: false
  # podTemplate volume that mounts the SQL ConfigMap (the ConfigMap name is read
  # from the CR, not derived from a naming convention).
  sqlVolumeName: "sql-scripts"
  # ConfigMap data key holding the job SQL.
  sqlFileKey: "job.sql"
